<style>

  --accent: #86a3ff; --accent-soft: #232f4f; --accent-ink: #0f131a;
  --crit: #ff7a70; --high: #f0a650; --med: #8fa8d6; --low: #8a93a4;
  --ok: #57c690; --warn: #e3b456; --bad: #ff7a70; --ok-soft: #173326; --warn-soft: #362a12; --bad-soft: #3a1c1a;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 4px 14px rgba(0,0,0,.3); color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0f131a; --surface: #161b24; --surface-2: #1d2430; --ink: #e5e9f0; --muted: #98a2b3; --line: #2a3242;
  --accent: #86a3ff; --accent-soft: #232f4f; --accent-ink: #0f131a;
  --crit: #ff7a70; --high: #f0a650; --med: #8fa8d6; --low: #8a93a4;
  --ok: #57c690; --warn: #e3b456; --bad: #ff7a70; --ok-soft: #173326; --warn-soft: #362a12; --bad-soft: #3a1c1a;

.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden }

.row-actions { display: flex; flex-wrap: wrap; gap: 8px }

/* modal */
.scrim { position: fixed; inset: 0; z-index: 50; background: rgba(10, 14, 22, .45); display: grid; place-items: start center; overflow-y: auto; padding: max(24px, env(safe-area-inset-top, 0px)) max(12px, env(safe-area-inset-right, 0px)) 24px max(12px, env(safe-area-inset-left, 0px)) }
.scrim[hidden] { display: none }
.modal { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); width: min(560px, 100%); padding: 18px; display: flex; flex-direction: column; gap: 14px; min-width: 0 }

.modal h2 { margin: 0; font-size: 17px }
.modal .actions { display: flex; flex-wrap: wrap; gap: 8px; justify-content: flex-end }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px 12px }
@media (max-width: 560px) { .grid2 { grid-template-columns: minmax(0, 1fr) } }
.settings-sec { border-top: 1px solid var(--line); padding-top: 12px; display: flex; flex-direction: column; gap: 8px }

.mrow input, .prow input, .prow select { border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; background: var(--surface); min-width: 0; width: 100% }

/* reports */
.rep { display: grid; grid-template-columns: 260px minmax(0, 1fr); gap: 18px }
@media (max-width: 800px) { .rep { grid-template-columns: minmax(0, 1fr) } }
.rep aside { display: flex; flex-direction: column; gap: 10px }

.nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(118px, 1fr)); gap: 8px }

.md h1 { font-size: 18px; margin: 0 } .md h2 { font-size: 14.5px; margin: 14px 0 4px } .md p { margin: 4px 0 } .md ul { margin: 2px 0; padding-left: 18px } .md .tw { overflow-x: auto }

.toast { position: fixed; z-index: 60; right: max(16px, env(safe-area-inset-right, 0px)); bottom: max(16px, env(safe-area-inset-bottom, 0px)); max-width: min(420px, calc(100% - 32px)); background: var(--ink); color: var(--bg); padding: 9px 13px; border-radius: 8px; box-shadow: var(--shadow); font-size: 13px }

<script type="module">
// Team Board: the shared rules. One file, used by the mod (imported) and by the
// dashboard page (inlined at build time), so both apply the same date rules,
// flags and report numbers. Pure functions only: no I/O, no clock of its own.

const PRIORITIES = ['critical', 'high', 'medium', 'low']
const TASK_STAGES = ['backlog', 'assigned', 'in_progress', 'in_review', 'done', 'cancelled']
const IDEA_STAGES = ['new', 'discussing', 'approved', 'converted', 'parked', 'rejected']
const NOTE_TAGS = ['update', 'decision', 'blocker', 'review']
const STAGE_LABEL = {
  backlog: 'Backlog',
  assigned: 'Assigned',
  in_progress: 'In progress',
  in_review: 'In review',
  done: 'Done',
  cancelled: 'Cancelled',
  new: 'New',
  discussing: 'Discussing',
  approved: 'Approved',
  converted: 'Converted',
  parked: 'Parked',
  rejected: 'Rejected',
}
const PRIORITY_LABEL = { critical: 'Critical', high: 'High', medium: 'Medium', low: 'Low' }
const DEFAULT_SETTINGS = {
  timezone: 'Asia/Beirut',
  staleDays: 5,
  wipLimit: 3,
  recentlyDoneDays: 14,
  jira: { cloudId: null, baseUrl: null },
  reports: { defaultScope: 'team', defaultPeriod: 'this_week' },
}
const PERIODS = { this_week: 'This week', last_week: 'Last week', this_month: 'This month', last_month: 'Last month', custom: 'Custom range' }

const OPEN_TASK = new Set(['backlog', 'assigned', 'in_progress', 'in_review'])
const ONGOING = new Set(['in_progress', 'in_review'])
const CLOSED = new Set(['done', 'cancelled'])

// ── dates (date-only strings, YYYY-MM-DD) ──────────────────────────────

/** Today's date in a time zone. */
function todayIn(tz, ms) {
  try {
    return new Intl.DateTimeFormat('en-CA', { timeZone: tz || 'UTC', year: 'numeric', month: '2-digit', day: '2-digit' }).format(new Date(ms))
  } catch {
    return new Date(ms).toISOString().slice(0, 10)
  }
}

function dayNum(d) {
  return Math.round(Date.parse(d + 'T00:00:00Z') / 86400000)
}

function addDays(d, n) {
  return new Date((dayNum(d) + n) * 86400000).toISOString().slice(0, 10)
}

/** Whole days from a to b (b later = positive). */
function daysBetween(a, b) {
  return dayNum(b) - dayNum(a)
}

function isDate(s) {
  return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !Number.isNaN(Date.parse(s + 'T00:00:00Z'))
}

/** Monday of the week holding d. */
function weekStart(d) {
  const wd = new Date(d + 'T00:00:00Z').getUTCDay()
  return addDays(d, -((wd + 6) % 7))
}

/** A report period as an inclusive date range. */
function periodRange(period, today, custom) {
  if (period === 'custom' && custom && isDate(custom.from) && isDate(custom.to)) {
    const [from, to] = custom.from <= custom.to ? [custom.from, custom.to] : [custom.to, custom.from]

    return { from, to, label: `${from} to ${to}` }
  }
  if (period === 'last_week') {
    const from = addDays(weekStart(today), -7)

    return { from, to: addDays(from, 6), label: `Week of ${from}` }
  }
  if (period === 'this_month' || period === 'last_month') {
    let y = Number(today.slice(0, 4))
    let m = Number(today.slice(5, 7))
    if (period === 'last_month') {
      m -= 1
      if (m === 0) {
        m = 12
        y -= 1
      }
    }
    const from = `${y}-${String(m).padStart(2, '0')}-01`
    const next = m === 12 ? `${y + 1}-01-01` : `${y}-${String(m + 1).padStart(2, '0')}-01`
    const names = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December']

    return { from, to: addDays(next, -1), label: `${names[m - 1]} ${y}` }
  }
  const from = weekStart(today)

  return { from, to: addDays(from, 6), label: `Week of ${from}` }
}

const inRange = (d, r) => isDate(d) && d >= r.from && d <= r.to
const dateOf = iso => (typeof iso === 'string' ? iso.slice(0, 10) : '')

// ── ids, ranks, keys ───────────────────────────────────────────────────

function formatId(kind, n) {
  return `${kind === 'idea' ? 'I' : 'T'}-${String(n).padStart(4, '0')}`
}

/** The next id for a kind from the counters doc; answers the id and the new counters. */
function nextId(kind, counters) {
  const c = { idea: 0, task: 0, ...(counters || {}) }
  c[kind] = (Number(c[kind]) || 0) + 1

  return { id: formatId(kind, c[kind]), counters: { idea: c.idea, task: c.task } }
}

function slugify(s) {
  return String(s || '')
    .toLowerCase()
    .normalize('NFKD')
    .replace(/[̀-ͯ]/g, '')
    .replace(/[^a-z0-9]+/g, '-')
    .replace(/^-+|-+$/g, '')
    .slice(0, 40)
}

const DIGITS = '0123456789abcdefghijklmnopqrstuvwxyz'

/**
 * A rank string strictly between a and b (either may be empty or null for an
 * open end). Fractional indexing: a drag writes one document. Never ends in 0.
 */
function rankBetween(a, b) {
  const lo = a || ''
  let hi = b || null
  if (hi !== null && lo >= hi) hi = null
  let out = ''
  for (let i = 0; i < 64; i++) {
    const da = i < lo.length ? DIGITS.indexOf(lo[i]) : 0
    const db = hi !== null && i < hi.length ? DIGITS.indexOf(hi[i]) : DIGITS.length
    if (da === db) {
      out += DIGITS[da]
      continue
    }
    const m = Math.floor((da + db) / 2)
    if (m > da) return out + DIGITS[m]
    out += DIGITS[da]
    hi = null
  }

  return out + 'i'
}

/** Ranks for n new items placed after `last`. */
function ranksAfter(last, n) {
  const out = []
  let prev = last || ''
  for (let i = 0; i < n; i++) {
    prev = rankBetween(prev, null)
    out.push(prev)
  }

  return out
}

/** A Jira key from a key or an issue URL; null when there is none. */
function normalizeJiraKey(input) {
  const s = String(input || '').trim()
  const m = /(?:browse\/|selectedIssue=|issues\/)?([A-Za-z][A-Za-z0-9_]{0,19}-\d{1,7})(?![\w-])/.exec(s)

  return m ? m[1].toUpperCase() : null
}

function jiraKeysFrom(text) {
  const out = []
  for (const part of String(text || '').split(/[\s,]+/)) {
    const k = normalizeJiraKey(part)
    if (k && !out.includes(k)) out.push(k)
  }

  return out
}

// ── sorting ────────────────────────────────────────────────────────────

const prioIdx = p => {
  const i = PRIORITIES.indexOf(p)

  return i < 0 ? 2 : i
}

/** Level, then rank, then id: the default order everywhere. */
function byPriority(a, b) {
  return prioIdx(a.priority) - prioIdx(b.priority) || String(a.rank || '').localeCompare(String(b.rank || '')) || String(a.id).localeCompare(String(b.id))
}

function byQueue(a, b) {
  const qa = a.queueRank || ''
  const qb = b.queueRank || ''
  if (qa && qb && qa !== qb) return qa < qb ? -1 : 1
  if (qa && !qb) return -1
  if (!qa && qb) return 1

  return byPriority(a, b)
}

/** The last rank in a priority band (for placing a new or moved item at its end). */
function lastRankIn(items, priority, type) {
  let last = ''
  for (const it of items) if (it.priority === priority && (!type || it.type === type) && (it.rank || '') > last) last = it.rank
  return last
}

function lastQueueRank(items, memberId) {
  let last = ''
  for (const it of items) if (it.type === 'task' && it.assigneeId === memberId && (it.queueRank || '') > last) last = it.queueRank
  return last
}

// ── items and the automatic rules ──────────────────────────────────────

let seq = 0

/** An event id that sorts by time. */
function eventId(nowIso) {
  seq = (seq + 1) % 1296

  return `E-${Date.parse(nowIso).toString(36)}-${seq.toString(36).padStart(2, '0')}${Math.floor(Math.random() * 1296).toString(36).padStart(2, '0')}`
}

function systemEvent(itemId, systemType, body, data, ctx) {
  return { id: eventId(ctx.nowIso), itemId, kind: 'system', tag: null, body, createdAt: ctx.nowIso, editedAt: null, resolved: false, systemType, data: data || {} }
}

function noteEvent(itemId, tag, body, ctx) {
  const t = NOTE_TAGS.includes(tag) ? tag : null

  return { id: eventId(ctx.nowIso), itemId, kind: 'note', tag: t, body: String(body || ''), createdAt: ctx.nowIso, editedAt: null, resolved: false, systemType: null, data: {} }
}

/**
 * A new idea or task. `fields` holds what the person gave; ctx carries
 * { today, nowIso, items } (items: to place the rank at the end of its band).
 * Answers the item and its creation events.
 */
function newItem(kind, id, fields, ctx) {
  const f = fields || {}
  const priority = PRIORITIES.includes(f.priority) ? f.priority : 'medium'
  const items = ctx.items || []
  const base = {
    id,
    type: kind,
    title: String(f.title || '').trim().slice(0, 120),
    description: String(f.description || ''),
    projectId: f.projectId || null,
    priority,
    rank: rankBetween(lastRankIn(items, priority, kind), null),
    archived: false,
    createdAt: ctx.nowIso,
    updatedAt: ctx.nowIso,
    lastActivityAt: ctx.nowIso,
  }
  const events = [systemEvent(id, 'created', `${kind === 'idea' ? 'Idea' : 'Task'} created`, {}, ctx)]
  if (kind === 'idea') {
    const item = {
      ...base,
      status: IDEA_STAGES.includes(f.status) ? f.status : 'new',
      ownerId: f.ownerId || null,
      rationale: String(f.rationale || ''),
      decision: String(f.decision || ''),
      jiraRefs: Array.isArray(f.jiraRefs) ? f.jiraRefs.map(normalizeJiraKey).filter(Boolean) : [],
      convertedTaskIds: [],
    }

    return { item, events }
  }
  const item = {
    ...base,
    status: 'backlog',
    assigneeId: null,
    collaboratorIds: Array.isArray(f.collaboratorIds) ? f.collaboratorIds.filter(Boolean) : [],
    assignmentHistory: [],
    queueRank: '',
    sourceIdeaId: f.sourceIdeaId || null,
    jiraKeys: [],
    etaOriginal: null,
    etaCurrent: null,
    etaHistory: [],
    startDate: null,
    reviewRequestedAt: null,
    reviewedBy: null,
    reviewedOn: null,
    reviewNote: '',
    endDate: null,
    manualDateFlags: [],
  }
  // The rest goes through the same rules as an edit, so a task captured as
  // "Ada, ETA Fri, in progress" gets its history and dates like any other.
  let cur = item
  const change = {}
  if (f.assigneeId) change.assigneeId = f.assigneeId
  if (f.eta) change.eta = f.eta
  if (Array.isArray(f.jiraKeys) && f.jiraKeys.length) change.jiraAdd = f.jiraKeys
  if (f.status && f.status !== 'backlog') change.status = f.status
  else if (f.assigneeId) change.status = 'assigned'
  if (Object.keys(change).length) {
    const r = applyChange(cur, change, { ...ctx, quiet: true })
    cur = { ...cur, ...r.patch }
    events.push(...r.events)
  }

  return { item: cur, events }
}

/**
 * Applies one change to an item by the rules of §6.3 and answers
 * { patch, events, warnings }. Never touches anything Jira owns.
 *
 * change (any of): status, assigneeId (null to unassign), collaboratorIds, eta
 * (null clears), reviewedBy (null clears), reviewNote, reviewedOn, priority,
 * rank, queueRank, title, description, projectId, ownerId, rationale, decision,
 * jiraAdd [keys], jiraRemove [keys], archived, dates { startDate | reviewRequestedAt | endDate | reviewedOn: date|null } (manual).
 * ctx: { today, nowIso, members, items, quiet }
 */
function applyChange(item, change, ctx) {
  const c = change || {}
  const patch = {}
  const events = []
  const warnings = []
  const ev = (type, body, data) => events.push(systemEvent(item.id, type, body, data, ctx))
  const isTask = item.type === 'task'
  const members = ctx.members || []
  const nameOf = id => (members.find(m => m.id === id) || {}).name || id || 'nobody'
  const cur = k => (k in patch ? patch[k] : item[k])

  for (const k of ['title', 'description', 'projectId', 'rationale', 'decision', 'reviewNote']) {
    if (k in c && c[k] !== item[k]) {
      patch[k] = k === 'title' ? String(c[k]).trim().slice(0, 120) : c[k]
      if (k === 'projectId') ev('project_changed', `Project: ${item.projectId || 'none'} → ${c[k] || 'none'}`, { from: item.projectId, to: c[k] })
    }
  }
  if ('priority' in c && PRIORITIES.includes(c.priority) && c.priority !== item.priority) {
    patch.priority = c.priority
    if (!('rank' in c)) patch.rank = rankBetween(lastRankIn((ctx.items || []).filter(x => x.id !== item.id), c.priority, item.type), null)
    ev('priority_changed', `Priority: ${PRIORITY_LABEL[item.priority] || item.priority} → ${PRIORITY_LABEL[c.priority]}`, { from: item.priority, to: c.priority })
  }
  if ('rank' in c && c.rank && c.rank !== item.rank) patch.rank = c.rank
  if ('queueRank' in c && c.queueRank !== item.queueRank) patch.queueRank = c.queueRank
  if ('ownerId' in c && c.ownerId !== item.ownerId) {
    patch.ownerId = c.ownerId || null
    ev('owner_changed', `Owner: ${nameOf(c.ownerId)}`, { from: item.ownerId, to: c.ownerId })
  }

  if (isTask && 'assigneeId' in c && (c.assigneeId || null) !== (item.assigneeId || null)) {
    const to = c.assigneeId || null
    const hist = (item.assignmentHistory || []).map(h => (h.to === null ? { ...h, to: ctx.today } : h))
    if (to) hist.push({ memberId: to, from: ctx.today, to: null })
    patch.assignmentHistory = hist
    patch.assigneeId = to
    patch.queueRank = to ? rankBetween(lastQueueRank((ctx.items || []).filter(x => x.id !== item.id), to), null) : ''
    patch.collaboratorIds = (cur('collaboratorIds') || []).filter(x => x !== to)
    ev('assigned', to ? `Assigned to ${nameOf(to)}` : 'Unassigned', { from: item.assigneeId || null, to })
    const rev = cur('reviewedBy')
    if (rev && rev === to) warnings.push('The reviewer is now the assignee; pick another reviewer.')
  }
  if (isTask && 'collaboratorIds' in c) {
    const list = [...new Set((c.collaboratorIds || []).filter(x => x && x !== cur('assigneeId')))]
    if (JSON.stringify(list) !== JSON.stringify(item.collaboratorIds || [])) patch.collaboratorIds = list
  }

  if ('status' in c && c.status && c.status !== item.status) {
    const to = c.status
    const from = item.status
    const valid = isTask ? TASK_STAGES : IDEA_STAGES
    if (!valid.includes(to)) {
      warnings.push(`"${to}" is not a ${isTask ? 'task' : 'idea'} stage.`)
    } else {
      patch.status = to
      ev('status_changed', `${STAGE_LABEL[from] || from} → ${STAGE_LABEL[to]}`, { from, to })
      if (isTask) {
        if (to === 'in_progress' && !cur('startDate')) patch.startDate = ctx.today
        if (to === 'in_review') patch.reviewRequestedAt = ctx.today
        if (CLOSED.has(to)) patch.endDate = ctx.today
        if (CLOSED.has(from) && !CLOSED.has(to) && item.endDate) {
          patch.endDate = null
          ev('reopened', `Reopened; end date ${item.endDate} cleared`, { endDate: item.endDate })
        }
        if (to === 'backlog' && cur('assigneeId') && !('assigneeId' in c)) warnings.push('Still assigned: unassign it too if it goes back to the pool.')
      }
    }
  }

  if (isTask && 'eta' in c) {
    const to = c.eta || null
    if (to && !isDate(to)) warnings.push(`ETA "${to}" is not a date (YYYY-MM-DD).`)
    else if (to !== (item.etaCurrent || null)) {
      if (to && !item.etaOriginal) patch.etaOriginal = to
      patch.etaCurrent = to
      patch.etaHistory = [...(item.etaHistory || []), { date: to, changedOn: ctx.today }]
      ev('eta_changed', to ? (item.etaCurrent ? `ETA ${item.etaCurrent} → ${to}` : `ETA set to ${to}`) : 'ETA cleared', { from: item.etaCurrent || null, to })
    }
  }

  if (isTask && 'reviewedBy' in c) {
    const to = c.reviewedBy || null
    const m = members.find(x => x.id === to)
    if (to && to === cur('assigneeId')) warnings.push('The reviewer cannot be the assignee.')
    else if (to && m && !m.isSenior) warnings.push(`${m.name} is not marked as senior.`)
    else if (to !== (item.reviewedBy || null)) {
      patch.reviewedBy = to
      if (to && !item.reviewedOn && !('reviewedOn' in c)) patch.reviewedOn = ctx.today
      if (!to) patch.reviewedOn = null
      ev('review_set', to ? `Reviewed by ${nameOf(to)}` : 'Reviewer cleared', { from: item.reviewedBy || null, to })
    }
  }
  if (isTask && 'reviewedOn' in c && (c.reviewedOn || null) !== (item.reviewedOn || null)) patch.reviewedOn = c.reviewedOn || null

  if (isTask && c.dates && typeof c.dates === 'object') {
    const flags = new Set(cur('manualDateFlags') || [])
    for (const k of ['startDate', 'reviewRequestedAt', 'endDate', 'reviewedOn']) {
      if (!(k in c.dates)) continue
      const v = c.dates[k] || null
      if (v && !isDate(v)) {
        warnings.push(`${k} "${v}" is not a date.`)
        continue
      }
      if (v === (item[k] || null)) continue
      patch[k] = v
      flags.add(k)
      ev('date_edited', `${k} set by hand to ${v || 'empty'}`, { field: k, from: item[k] || null, to: v })
    }
    patch.manualDateFlags = [...flags]
  }

  const keysField = isTask ? 'jiraKeys' : 'jiraRefs'
  if (Array.isArray(c.jiraAdd) && c.jiraAdd.length) {
    const list = [...(cur(keysField) || [])]
    for (const raw of c.jiraAdd) {
      const k = normalizeJiraKey(raw)
      if (!k) {
        warnings.push(`"${raw}" is not a Jira key or link.`)
        continue
      }
      if (list.includes(k)) continue
      list.push(k)
      ev('jira_key_added', `Linked ${k}`, { key: k })
    }
    patch[keysField] = list
  }
  if (Array.isArray(c.jiraRemove) && c.jiraRemove.length) {
    const drop = new Set(c.jiraRemove.map(normalizeJiraKey).filter(Boolean))
    const before = cur(keysField) || []
    const list = before.filter(k => !drop.has(k))
    for (const k of before) if (drop.has(k)) ev('jira_key_removed', `Unlinked ${k}`, { key: k })
    patch[keysField] = list
  }

  if ('archived' in c && !!c.archived !== !!item.archived) {
    patch.archived = !!c.archived
    ev(c.archived ? 'archived' : 'restored', c.archived ? 'Archived' : 'Restored', {})
  }

  if (Object.keys(patch).length > 0) {
    patch.updatedAt = ctx.nowIso
    patch.lastActivityAt = ctx.nowIso
  }

  return { patch, events: ctx.quiet ? events.filter(e => e.systemType !== 'created') : events, warnings }
}

/**
 * Converts an idea into tasks. titles: [{ title, assigneeId?, eta? }].
 * Answers { ideaPatch, tasks: [{item, events}], ideaEvents, counters }.
 */
function convertIdea(idea, specs, counters, ctx) {
  let c = counters
  const tasks = []
  let items = [...(ctx.items || [])]
  for (const s of specs) {
    const n = nextId('task', c)
    c = n.counters
    const made = newItem(
      'task',
      n.id,
      { title: s.title, description: s.description ?? idea.description, projectId: s.projectId || idea.projectId, priority: s.priority || idea.priority, assigneeId: s.assigneeId, eta: s.eta, sourceIdeaId: idea.id },
      { ...ctx, items },
    )
    items = [...items, made.item]
    tasks.push(made)
  }
  const ids = tasks.map(t => t.item.id)
  const r = applyChange(idea, { status: 'converted' }, ctx)
  const ideaPatch = { ...r.patch, convertedTaskIds: [...(idea.convertedTaskIds || []), ...ids] }
  const ideaEvents = [...r.events, systemEvent(idea.id, 'converted', `Converted to ${ids.join(', ')}`, { taskIds: ids }, ctx)]

  return { ideaPatch, tasks, ideaEvents, counters: c }
}

// ── derived flags ──────────────────────────────────────────────────────

/** Unresolved blocker notes per item id. */
function openBlockers(events) {
  const out = new Map()
  for (const e of events || []) {
    if (e.kind !== 'note' || e.tag !== 'blocker' || e.resolved) continue
    const list = out.get(e.itemId) || []
    list.push(e)
    out.set(e.itemId, list)
  }

  return out
}

/**
 * Flags for one item. ctx: { today, settings, blockers (Map), jira ({key: snap}), members }.
 * Answers { overdue, slipped, slipDays, stale, blocked, needsClosing, mismatch, wip? }.
 */
function flagsFor(item, ctx) {
  const s = { ...DEFAULT_SETTINGS, ...(ctx.settings || {}) }
  const f = { overdue: false, slipped: false, slipDays: 0, stale: false, blocked: false, needsClosing: false, mismatch: false }
  if (item.type === 'task') {
    const open = OPEN_TASK.has(item.status)
    if (open && item.etaCurrent && item.etaCurrent < ctx.today) f.overdue = true
    if (item.etaCurrent && item.etaOriginal && item.etaCurrent > item.etaOriginal) {
      f.slipped = true
      f.slipDays = daysBetween(item.etaOriginal, item.etaCurrent)
    }
    if (item.status === 'in_progress' && item.lastActivityAt) {
      const idle = daysBetween(dateOf(item.lastActivityAt), ctx.today)
      if (idle > Number(s.staleDays || 5)) f.stale = true
    }
    const keys = item.jiraKeys || []
    const snaps = keys.map(k => (ctx.jira || {})[k]).filter(Boolean)
    if (keys.length && open && snaps.length === keys.length && snaps.every(j => !j.error && j.statusCategory === 'done')) f.needsClosing = true
    const me = (ctx.members || []).find(m => m.id === item.assigneeId)
    if (me && me.jiraAccountId && snaps.some(j => j.assigneeAccountId && j.assigneeAccountId !== me.jiraAccountId)) f.mismatch = true
  }
  if (ctx.blockers && (ctx.blockers.get(item.id) || []).length) f.blocked = true

  return f
}

function isOngoing(item) {
  return item.type === 'task' && ONGOING.has(item.status)
}

function isOpenTask(item) {
  return item.type === 'task' && OPEN_TASK.has(item.status)
}

/** Members over the WIP limit: { memberId: count }. */
function wipOver(items, limit) {
  const n = {}
  for (const it of items) if (!it.archived && isOngoing(it) && it.assigneeId) n[it.assigneeId] = (n[it.assigneeId] || 0) + 1
  const out = {}
  for (const [k, v] of Object.entries(n)) if (v > Number(limit || 3)) out[k] = v

  return out
}

// ── Jira snapshots ─────────────────────────────────────────────────────

const JIRA_FIELDS = ['summary', 'status', 'assignee', 'priority', 'created', 'updated', 'resolutiondate']

/** A jira/{key} doc from one issue as the connector returns it. */
function jiraSnapshot(issue, nowIso) {
  const f = (issue && issue.fields) || {}
  const st = f.status || {}
  const as = f.assignee || {}

  return {
    key: String(issue.key || ''),
    summary: String(f.summary || ''),
    status: String(st.name || ''),
    statusCategory: String((st.statusCategory || {}).key || ''),
    assigneeAccountId: as.accountId || null,
    assigneeName: as.displayName || null,
    priority: (f.priority || {}).name || null,
    created: f.created || null,
    updated: f.updated || null,
    resolutionDate: f.resolutiondate || null,
    fetchedAt: nowIso,
    error: null,
  }
}

/** Issues from a search answer in any of the shapes the connector uses. */
function issuesFrom(answer) {
  const a = answer && typeof answer === 'object' ? answer : {}
  const d = a.data && typeof a.data === 'object' ? a.data : a
  if (Array.isArray(d.issues)) return d.issues
  if (d.issues && Array.isArray(d.issues.nodes)) return d.issues.nodes
  if (d.key && d.fields) return [d]

  return []
}

/** The keys to refresh, in chunks (JQL `key in (…)`). */
function jiraChunks(items, size) {
  const keys = new Set()
  for (const it of items) if (!it.archived) for (const k of [...(it.jiraKeys || []), ...(it.jiraRefs || [])]) keys.add(k)
  const list = [...keys].sort()
  const out = []
  for (let i = 0; i < list.length; i += size || 10) out.push(list.slice(i, i + (size || 10)))

  return out
}

// ── filters ────────────────────────────────────────────────────────────

/**
 * The items a filter set keeps. f: { project, team, member, type, priority,
 * status, flags: [..], archived, q }. ctx as flagsFor, plus members.
 */
function filterItems(items, f, ctx) {
  const members = ctx.members || []
  const teamOf = id => (members.find(m => m.id === id) || {}).teams || []
  const q = String(f.q || '').trim().toLowerCase()

  return items.filter(it => {
    if (!f.archived && it.archived) return false
    if (f.project && it.projectId !== f.project) return false
    if (f.type && it.type !== f.type) return false
    if (f.priority && it.priority !== f.priority) return false
    if (f.status && it.status !== f.status) return false
    const people = it.type === 'task' ? [it.assigneeId, ...(it.collaboratorIds || [])] : [it.ownerId]
    if (f.member && !people.includes(f.member)) return false
    if (f.team && !people.some(p => teamOf(p).includes(f.team))) return false
    if (q && !`${it.id} ${it.title} ${it.description || ''} ${(it.jiraKeys || it.jiraRefs || []).join(' ')}`.toLowerCase().includes(q)) return false
    if (f.flags && f.flags.length) {
      const fl = flagsFor(it, ctx)
      if (!f.flags.every(k => fl[k])) return false
    }

    return true
  })
}

// ── reports ────────────────────────────────────────────────────────────

/** Scope label and member set. scope: { kind: team|group|project|member, value }. */
function scopeOf(scope, members, projects) {
  const s = scope || { kind: 'team' }
  if (s.kind === 'group') return { label: `${s.value} team`, members: members.filter(m => (m.teams || []).includes(s.value)) }
  if (s.kind === 'member') {
    const m = members.find(x => x.id === s.value)

    return { label: m ? m.name : s.value, members: m ? [m] : [] }
  }
  if (s.kind === 'project') {
    const p = projects.find(x => x.id === s.value)

    return { label: p ? p.name : s.value, members, project: s.value }
  }

  return { label: 'Whole team', members }
}

/**
 * The report numbers, deterministic. input: { items, events, members, projects,
 * jira, settings, scope, period, custom, today }. Reports attribute a task to
 * its current assignee only.
 */
function computeReport(input) {
  const { items = [], events = [], members = [], projects = [], jira = {}, settings = {}, today } = input
  const range = periodRange(input.period || 'this_week', today, input.custom)
  const sc = scopeOf(input.scope, members, projects)
  const ids = new Set(sc.members.map(m => m.id))
  const live = items.filter(it => !it.archived)
  const inScope = it => {
    if (sc.project) return it.projectId === sc.project
    if (!input.scope || input.scope.kind === 'team') return true
    if (it.type === 'task') return ids.has(it.assigneeId)

    return ids.has(it.ownerId)
  }
  const tasks = live.filter(it => it.type === 'task' && inScope(it))
  const ideas = live.filter(it => it.type === 'idea' && inScope(it))
  const blockers = openBlockers(events)
  const fctx = { today, settings, blockers, jira, members }
  const nameOf = id => (members.find(m => m.id === id) || {}).name || (id ? id : 'Unassigned')
  const row = it => ({ id: it.id, title: it.title, priority: it.priority, status: it.status, assignee: nameOf(it.assigneeId || it.ownerId), project: (projects.find(p => p.id === it.projectId) || {}).name || it.projectId || '', jiraKeys: it.jiraKeys || it.jiraRefs || [], eta: it.etaCurrent || null, endDate: it.endDate || null })

  const delivered = tasks.filter(t => t.status === 'done' && inRange(t.endDate, range))
  const inProgress = tasks.filter(t => ONGOING.has(t.status))
  const flagged = tasks.map(t => ({ t, f: flagsFor(t, fctx) }))
  const overdue = flagged.filter(x => x.f.overdue).map(x => x.t)
  const withEta = delivered.filter(t => t.etaOriginal)
  const onTime = withEta.filter(t => t.endDate <= t.etaOriginal)
  const cycles = delivered.filter(t => t.startDate && t.endDate).map(t => Math.max(0, daysBetween(t.startDate, t.endDate)))
  const slipSet = tasks.filter(t => OPEN_TASK.has(t.status) || delivered.includes(t))
  const totalSlip = slipSet.reduce((a, t) => a + (t.etaCurrent && t.etaOriginal && t.etaCurrent > t.etaOriginal ? daysBetween(t.etaOriginal, t.etaCurrent) : 0), 0)

  const deliveredByPriority = PRIORITIES.map(p => ({ priority: p, items: delivered.filter(t => t.priority === p).sort(byPriority).map(row) })).filter(g => g.items.length)

  const risk = (pred, label) => flagged.filter(x => OPEN_TASK.has(x.t.status) && pred(x.f)).map(x => ({ ...row(x.t), reason: label(x) }))
  const risks = {
    overdue: risk(f => f.overdue, x => `due ${x.t.etaCurrent}`),
    slipped: risk(f => f.slipped, x => `slipped ${x.f.slipDays}d (${x.t.etaOriginal} → ${x.t.etaCurrent})`),
    stale: risk(f => f.stale, x => `no activity since ${dateOf(x.t.lastActivityAt)}`),
    blocked: risk(f => f.blocked, x => (blockers.get(x.t.id) || []).map(e => e.body).join(' · ')),
  }

  const itemIds = new Set([...tasks, ...ideas].map(i => i.id))
  const decisions = events
    .filter(e => e.kind === 'note' && e.tag === 'decision' && itemIds.has(e.itemId) && inRange(dateOf(e.createdAt), range))
    .sort((a, b) => String(a.createdAt).localeCompare(String(b.createdAt)))
    .map(e => {
      const it = items.find(i => i.id === e.itemId) || {}

      return { itemId: e.itemId, title: it.title || '', date: dateOf(e.createdAt), body: e.body }
    })

  const people = input.scope && input.scope.kind === 'project' ? members.filter(m => tasks.some(t => t.assigneeId === m.id)) : sc.members
  const workload = people
    .filter(m => m.active !== false || tasks.some(t => t.assigneeId === m.id))
    .map(m => ({
      memberId: m.id,
      name: m.name,
      ongoing: tasks.filter(t => t.assigneeId === m.id && ONGOING.has(t.status)).length,
      done: delivered.filter(t => t.assigneeId === m.id).length,
      overdue: overdue.filter(t => t.assigneeId === m.id).length,
      reviewed: live.filter(t => t.type === 'task' && t.reviewedBy === m.id && inRange(t.reviewedOn, range)).length,
    }))
  const memberItems = input.scope && input.scope.kind === 'member' ? tasks.filter(t => !CLOSED.has(t.status) || inRange(t.endDate, range)).sort(byPriority).map(row) : []

  const stageMoves = to => new Set(events.filter(e => e.systemType === 'status_changed' && e.data && e.data.to === to && inRange(dateOf(e.createdAt), range)).map(e => e.itemId))
  const ideaIds = new Set(ideas.map(i => i.id))
  const countIn = set => [...set].filter(id => ideaIds.has(id)).length
  const pipeline = {
    created: ideas.filter(i => inRange(dateOf(i.createdAt), range)).length,
    approved: countIn(stageMoves('approved')),
    converted: countIn(stageMoves('converted')),
    rejected: countIn(stageMoves('rejected')),
  }

  const horizon = addDays(today, 14)
  const comingUp = tasks
    .filter(t => OPEN_TASK.has(t.status) && t.etaCurrent && t.etaCurrent >= today && t.etaCurrent <= horizon)
    .sort((a, b) => a.etaCurrent.localeCompare(b.etaCurrent) || byPriority(a, b))
    .map(row)

  return {
    scope: input.scope || { kind: 'team' },
    scopeLabel: sc.label,
    period: input.period || 'this_week',
    range,
    today,
    headline: {
      delivered: delivered.length,
      inProgress: inProgress.length,
      overdue: overdue.length,
      onTimeRate: withEta.length ? Math.round((onTime.length / withEta.length) * 100) : null,
      onTimeBase: withEta.length,
      avgCycleDays: cycles.length ? Math.round((cycles.reduce((a, b) => a + b, 0) / cycles.length) * 10) / 10 : null,
      totalSlipDays: totalSlip,
    },
    delivered: deliveredByPriority,
    risks,
    decisions,
    workload,
    memberItems,
    pipeline,
    comingUp,
  }
}

const mdEsc = s => String(s || '').replace(/\|/g, '\\|').replace(/\n+/g, ' ')

/** The report as Markdown; empty sections are left out. */
function reportMarkdown(r, summary) {
  const h = r.headline
  const out = [`# Team Board report: ${r.scopeLabel}`, '', `${r.range.label} (${r.range.from} to ${r.range.to}) · generated ${r.today}`, '']
  if (summary && summary.trim()) out.push('## Executive summary', '', summary.trim(), '')
  out.push(
    '## Headline numbers',
    '',
    '| Delivered | In progress | Overdue | On-time rate | Avg cycle time | Total slip |',
    '| --- | --- | --- | --- | --- | --- |',
    `| ${h.delivered} | ${h.inProgress} | ${h.overdue} | ${h.onTimeRate === null ? 'n/a' : `${h.onTimeRate}% of ${h.onTimeBase}`} | ${h.avgCycleDays === null ? 'n/a' : `${h.avgCycleDays} day${h.avgCycleDays === 1 ? '' : 's'}`} | ${h.totalSlipDays} day${h.totalSlipDays === 1 ? '' : 's'} |`,
    '',
  )
  if (r.delivered.length) {
    out.push('## Delivered', '')
    for (const g of r.delivered) {
      out.push(`**${PRIORITY_LABEL[g.priority]}**`, '')
      for (const t of g.items) out.push(`- ${t.id} ${mdEsc(t.title)} · ${mdEsc(t.assignee)}${t.jiraKeys.length ? ` · ${t.jiraKeys.join(', ')}` : ''}`)
      out.push('')
    }
  }
  const risks = [
    ['Overdue', r.risks.overdue],
    ['Slipped', r.risks.slipped],
    ['Stale', r.risks.stale],
    ['Blocked', r.risks.blocked],
  ].filter(([, l]) => l.length)
  if (risks.length) {
    out.push('## Risks', '')
    for (const [label, list] of risks) {
      out.push(`**${label}**`, '')
      for (const t of list) out.push(`- ${t.id} ${mdEsc(t.title)} · ${mdEsc(t.assignee)} · ${mdEsc(t.reason)}`)
      out.push('')
    }
  }
  if (r.decisions.length) {
    out.push('## Decisions', '')
    for (const d of r.decisions) out.push(`- ${d.date} · ${d.itemId} ${mdEsc(d.title)}: ${mdEsc(d.body)}`)
    out.push('')
  }
  if (r.workload.length) {
    out.push('## Workload', '', '| Member | Ongoing | Done | Overdue | Reviewed |', '| --- | --- | --- | --- | --- |')
    for (const w of r.workload) out.push(`| ${mdEsc(w.name)} | ${w.ongoing} | ${w.done} | ${w.overdue} | ${w.reviewed} |`)
    out.push('')
  }
  if (r.memberItems.length) {
    out.push('## Items', '')
    for (const t of r.memberItems) out.push(`- ${t.id} ${mdEsc(t.title)} · ${STAGE_LABEL[t.status] || t.status}${t.eta ? ` · ETA ${t.eta}` : ''}`)
    out.push('')
  }
  const p = r.pipeline
  if (p.created + p.approved + p.converted + p.rejected > 0) {
    out.push('## Ideas pipeline', '', `Created ${p.created} · approved ${p.approved} · converted ${p.converted} · rejected ${p.rejected}`, '')
  }
  if (r.comingUp.length) {
    out.push('## Coming up (next 14 days)', '')
    for (const t of r.comingUp) out.push(`- ${t.eta} · ${t.id} ${mdEsc(t.title)} · ${mdEsc(t.assignee)}`)
    out.push('')
  }

  return out.join('\n').trim() + '\n'
}

const csvCell = v => {
  const s = Array.isArray(v) ? v.join(' ') : v === null || v === undefined ? '' : String(v)

  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s
}

/** Raw rows behind a report, one per task or idea in scope. */
function reportCsv(input) {
  const { items = [], members = [], projects = [] } = input
  const r = computeReport(input)
  const sc = scopeOf(input.scope, members, projects)
  const ids = new Set(sc.members.map(m => m.id))
  const nameOf = id => (members.find(m => m.id === id) || {}).name || ''
  const rows = items
    .filter(it => !it.archived)
    .filter(it => (sc.project ? it.projectId === sc.project : !input.scope || input.scope.kind === 'team' ? true : ids.has(it.type === 'task' ? it.assigneeId : it.ownerId)))
    .sort(byPriority)
  const head = ['id', 'type', 'title', 'project', 'priority', 'status', 'assignee_or_owner', 'eta_original', 'eta_current', 'start', 'review_requested', 'reviewed_by', 'reviewed_on', 'end', 'jira']
  const lines = [head.join(',')]
  for (const it of rows) {
    lines.push(
      [
        it.id,
        it.type,
        it.title,
        (projects.find(p => p.id === it.projectId) || {}).name || it.projectId,
        it.priority,
        it.status,
        nameOf(it.type === 'task' ? it.assigneeId : it.ownerId),
        it.etaOriginal,
        it.etaCurrent,
        it.startDate,
        it.reviewRequestedAt,
        nameOf(it.reviewedBy),
        it.reviewedOn,
        it.endDate,
        it.jiraKeys || it.jiraRefs,
      ]
        .map(csvCell)
        .join(','),
    )
  }

  return { csv: lines.join('\n') + '\n', report: r }
}

/** Facts for a drafted summary: plain numbers only, nothing invented. */
function summaryFacts(r) {
  const h = r.headline

  return [
    `Scope: ${r.scopeLabel}. Period: ${r.range.label} (${r.range.from} to ${r.range.to}).`,
    `Delivered ${h.delivered}; in progress ${h.inProgress}; overdue ${h.overdue}; on-time rate ${h.onTimeRate === null ? 'n/a' : h.onTimeRate + '% of ' + h.onTimeBase}; average cycle ${h.avgCycleDays === null ? 'n/a' : h.avgCycleDays + ' days'}; total slip ${h.totalSlipDays} days.`,
    r.delivered.length ? `Delivered: ${r.delivered.flatMap(g => g.items.map(t => `${t.title} (${g.priority})`)).join('; ')}.` : '',
    r.risks.blocked.length ? `Blocked: ${r.risks.blocked.map(t => `${t.title}: ${t.reason}`).join('; ')}.` : '',
    r.risks.overdue.length ? `Overdue: ${r.risks.overdue.map(t => t.title).join('; ')}.` : '',
    r.risks.slipped.length ? `Slipped: ${r.risks.slipped.map(t => `${t.title} ${t.reason}`).join('; ')}.` : '',
    r.decisions.length ? `Decisions: ${r.decisions.map(d => d.body).join('; ')}.` : '',
    `Ideas: created ${r.pipeline.created}, approved ${r.pipeline.approved}, converted ${r.pipeline.converted}, rejected ${r.pipeline.rejected}.`,
    r.comingUp.length ? `Due in the next 14 days: ${r.comingUp.map(t => `${t.title} (${t.eta})`).join('; ')}.` : '',
  ]
    .filter(Boolean)
    .join('\n')
}

/** The one-line status: "2 overdue · 1 blocked"; empty when nothing to show. */
function statusLine(items, events, ctx) {
  const blockers = openBlockers(events)
  let overdue = 0
  let blocked = 0
  for (const it of items) {
    if (it.archived || it.type !== 'task') continue
    const f = flagsFor(it, { ...ctx, blockers })
    if (f.overdue) overdue += 1
    if (f.blocked && isOpenTask(it)) blocked += 1
  }
  const parts = []
  if (overdue) parts.push(`${overdue} overdue`)
  if (blocked) parts.push(`${blocked} blocked`)

  return parts.join(' · ')
}


// ── setup ──────────────────────────────────────────────────────────────
const JIRA_SERVER = 'Atlassian MCP'
const VIEWS = { team: 'Team', kanban: 'Kanban', list: 'List', ideas: 'Ideas' }
const COLLS = ['config', 'members', 'projects', 'items', 'events', 'jira', 'reports']
const FLAG_LABEL = { overdue: 'Overdue', slipped: 'Slipped', stale: 'Stale', blocked: 'Blocked', needsClosing: 'Needs closing' }
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c])
const byId = id => document.getElementById(id)

const S = {
  db: null, user: null, mcp: null, downloads: null, sample: null, canWrite: true, caps: 'loading',
  loaded: new Set(), error: '', settings: null, counters: null, members: [], projects: [], items: [], events: [], jira: {}, reports: [],
  ui: loadUi(), drawerId: null, drawerDirty: false, modal: null, selected: new Set(), listLimit: 200, busy: '', dragId: null, jiraBusy: false,
}

function loadUi() {
  const base = { view: 'team', f: { project: '', team: '', member: '', type: '', priority: '', status: '', flags: [], archived: false, q: '' }, sort: { key: '', dir: 1 }, feed: 'all' }
  try {
    const v = JSON.parse(localStorage.getItem('team-board-ui') || 'null')
    if (v && typeof v === 'object') return { ...base, ...v, f: { ...base.f, ...(v.f || {}) } }
  } catch {}
  return base
}
function saveUi() { try { localStorage.setItem('team-board-ui', JSON.stringify(S.ui)) } catch {} }

const settings = () => ({ ...DEFAULT_SETTINGS, ...(S.settings || {}), jira: { ...DEFAULT_SETTINGS.jira, ...((S.settings || {}).jira || {}) }, reports: { ...DEFAULT_SETTINGS.reports, ...((S.settings || {}).reports || {}) } })
const today = () => todayIn(settings().timezone, Date.now())
const ctx = () => ({ today: today(), nowIso: new Date().toISOString(), members: S.members, items: S.items })
const fctx = () => ({ today: today(), settings: settings(), blockers: openBlockers(S.events), jira: S.jira, members: S.members })
const member = id => S.members.find(m => m.id === id)
const project = id => S.projects.find(p => p.id === id)
const item = id => S.items.find(i => i.id === id)
const nameOf = id => (member(id) || {}).name || id || 'Unassigned'
const activeMembers = () => S.members.filter(m => m.active !== false).sort((a, b) => a.name.localeCompare(b.name))
const teams = () => [...new Set(S.members.flatMap(m => m.teams || []))].sort()
const ready = () => COLLS.every(c => S.loaded.has(c))

function ago(iso) {
  if (!iso) return 'never'
  const s = Math.max(0, (Date.now() - Date.parse(iso)) / 1000)
  if (s < 90) return 'just now'
  if (s < 5400) return `${Math.round(s / 60)} min ago`
  if (s < 129600) return `${Math.round(s / 3600)} h ago`
  return `${Math.round(s / 86400)} d ago`
}
function shortDate(d) {
  if (!d) return ''
  const t = today()
  if (d === t) return 'Today'
  if (d === addDays(t, 1)) return 'Tomorrow'
  if (d === addDays(t, -1)) return 'Yesterday'
  const dt = new Date(d + 'T00:00:00Z')
  return dt.toLocaleDateString('en-GB', { day: 'numeric', month: 'short', timeZone: 'UTC' })
}
function initials(name) { return String(name || '?').split(/\s+/).filter(Boolean).slice(0, 2).map(w => w[0].toUpperCase()).join('') }
function hue(id) { let h = 0; for (const ch of String(id)) h = (h * 31 + ch.charCodeAt(0)) >>> 0; return h % 360 }
function avatar(id) { const m = member(id); return m ? `<span class="av" title="${esc(m.name)}" style="background:hsl(${hue(id)} 45% 45%)">${esc(initials(m.name))}</span>` : '' }

let toastTimer = 0
function toast(text, kind = '') {
  const t = byId('toast')
  t.textContent = text
  t.className = `toast ${kind}`
  t.hidden = false
  clearTimeout(toastTimer)
  toastTimer = setTimeout(() => (t.hidden = true), kind ? 6000 : 3500)
}

// ── capabilities and data ──────────────────────────────────────────────
async function boot() {
  const use = name => (window.claude && typeof window.claude.use === 'function' ? window.claude.use(name).catch(() => null) : Promise.resolve(null))
  const timer = setTimeout(() => { if (!ready()) { S.error = S.db ? 'The board did not finish loading within 10 seconds. It keeps trying; check your connection.' : 'The board’s database is not available in this view.'; render() } }, 10000)
  const [db, user, mcp, downloads, sample] = await Promise.all(['db', 'user', 'mcp', 'downloads', 'sample'].map(use))
  Object.assign(S, { db, user, mcp, downloads, sample, caps: 'ready' })
  if (user) { try { S.canWrite = (await user.isOwner()) !== false } catch { S.canWrite = true } }
  if (!db) { clearTimeout(timer); S.error = 'The board’s database is not available in this view (signed out, or not allowed). Nothing can be shown or saved here.'; render(); return }
  const onErr = e => { S.error = `The board could not read its data: ${e && e.message ? e.message : 'unknown error'}.`; render() }
  for (const name of COLLS) {
    db.collection(name).onSnapshot(snap => {
      const docs = snap.docs.map(d => ({ ...d.data(), id: d.id }))
      if (name === 'config') { S.settings = docs.find(d => d.id === 'settings') || null; S.counters = docs.find(d => d.id === 'counters') || null }
      else if (name === 'jira') { S.jira = Object.fromEntries(docs.map(d => [d.id, d])) }
      else S[name] = docs
      S.loaded.add(name)
      if (ready()) { clearTimeout(timer); if (S.error.startsWith('The board did not finish')) S.error = '' }
      render()
    }, onErr)
  }
  render()
}

function need() {
  if (!S.db) { toast('The database is not available here.', 'bad'); return false }
  if (!S.canWrite) { toast('Read-only: only the board’s owner can change it.', 'warn'); return false }
  return true
}
async function put(path, data) { await S.db.doc(path).set(data) }
async function patchDoc(path, data) { await S.db.doc(path).update(data) }

async function writeChange(it, ch) {
  if (!need()) return null
  const r = applyChange(it, ch, ctx())
  if (r.warnings.length) toast(r.warnings.join(' '), 'warn')
  if (!Object.keys(r.patch).length) return r
  try {
    await patchDoc(`items/${it.id}`, r.patch)
    for (const e of r.events) await put(`events/${e.id}`, e)
  } catch (err) { toast(`Not saved: ${err.message || err}`, 'bad') }
  return r
}

async function takeIds(kind, n = 1) {
  const snap = await S.db.doc('config/counters').get()
  let c = (snap.exists && snap.data()) || { idea: 0, task: 0 }
  const ids = []
  for (let i = 0; i < n; i++) { const x = nextId(kind, c); ids.push(x.id); c = x.counters }
  await put('config/counters', c)
  return ids
}

async function createItem(kind, fields) {
  if (!need()) return null
  const [id] = await takeIds(kind)
  const made = newItem(kind, id, fields, ctx())
  await put(`items/${id}`, made.item)
  for (const e of made.events) await put(`events/${e.id}`, e)
  if (made.item.jiraKeys && made.item.jiraKeys.length) validateKeys(made.item.jiraKeys)
  return made.item
}

// ── Jira (read only) ───────────────────────────────────────────────────
function payloadOf(res) {
  if (!res) return {}
  if (res.payload !== undefined && res.payload !== null) return typeof res.payload === 'string' ? safeJson(res.payload) : res.payload
  if (res.structuredContent) return res.structuredContent
  const text = (res.content || []).map(b => (b && b.type === 'text' ? b.text : '')).join('')
  return safeJson(text)
}
function safeJson(t) { try { return JSON.parse(t) } catch { return { text: t } } }
async function jiraCall(tool, input) {
  try { return payloadOf(await S.mcp.callTool(JIRA_SERVER, tool, input)) }
  catch (e) {
    if (e && e.retryable) { await new Promise(r => setTimeout(r, e.retryAfterMs || 1500)); return payloadOf(await S.mcp.callTool(JIRA_SERVER, tool, input)) }
    throw e
  }
}
const accessLost = e => e && ['needs_reauth', 'not_granted', 'blocked_by_policy', 'consent_required', 'user_changed'].includes(e.code)
async function ensureCloud() {
  const s = settings()
  if (s.jira.cloudId) return s.jira.cloudId
  const p = await jiraCall('getAccessibleAtlassianResources', {})
  const list = Array.isArray(p) ? p : Array.isArray(p.resources) ? p.resources : Array.isArray(p.data) ? p.data : (p.data && p.data.resources) || []
  const site = list.find(x => (x.scopes || []).some(sc => /jira/.test(sc)) || (x.products || []).some(pr => pr.id === 'jira')) || list[0]
  if (!site) throw new Error('No Atlassian site is reachable through your connection.')
  if (S.canWrite) await patchDoc('config/settings', { jira: { ...s.jira, cloudId: site.id || site.cloudId, baseUrl: site.url || null } })
  return site.id || site.cloudId
}
async function saveSnap(key, snap) {
  const old = S.jira[key]
  await put(`jira/${key}`, snap)
  if (old && old.status && snap.status && old.status !== snap.status) {
    for (const it of S.items.filter(i => !i.archived && [...(i.jiraKeys || []), ...(i.jiraRefs || [])].includes(key))) {
      const e = systemEvent(it.id, 'jira_refreshed', `Jira ${key}: ${old.status} → ${snap.status}`, { key, from: old.status, to: snap.status }, ctx())
      await put(`events/${e.id}`, e)
    }
  }
}
async function fetchOne(cloudId, key) {
  const nowIso = new Date().toISOString()
  try {
    const p = await jiraCall('getJiraIssue', { cloudId, issueIdOrKey: key, fields: JIRA_FIELDS })
    const issue = issuesFrom(p)[0]
    if (!issue) throw Object.assign(new Error('not found'), { code: 'not_found' })
    await saveSnap(key, jiraSnapshot(issue, nowIso))
  } catch (e) {
    const lost = accessLost(e)
    await put(`jira/${key}`, { key, summary: lost ? '' : (S.jira[key] || {}).summary || '', status: lost ? '' : (S.jira[key] || {}).status || '', statusCategory: lost ? '' : (S.jira[key] || {}).statusCategory || '', assigneeAccountId: null, assigneeName: null, priority: null, created: null, updated: null, resolutionDate: null, fetchedAt: nowIso, error: lost ? 'access lost' : 'not found or no access' })
    if (lost) throw e
  }
}
async function validateKeys(keys) {
  if (!S.mcp || !S.canWrite) return
  try { const cloudId = await ensureCloud(); for (const k of keys) await fetchOne(cloudId, k) }
  catch (e) { toast(`Jira: ${e.message || e.code || e}`, 'warn') }
}
async function refreshJira() {
  if (!S.mcp) { toast('Jira is not connected to this page.', 'warn'); return }
  if (!need() || S.jiraBusy) return
  S.jiraBusy = true
  render()
  let done = 0
  try {
    const cloudId = await ensureCloud()
    const chunks = jiraChunks(S.items, 10)
    for (const chunk of chunks) {
      const nowIso = new Date().toISOString()
      try {
        const p = await jiraCall('searchJiraIssuesUsingJql', { cloudId, jql: `key in (${chunk.join(', ')})`, fields: JIRA_FIELDS, maxResults: chunk.length })
        if (p && typeof p.text === 'string' && !p.issues) throw new Error('unreadable answer')
        const found = new Map(issuesFrom(p).map(i => [String(i.key).toUpperCase(), i]))
        for (const k of chunk) { if (found.has(k)) await saveSnap(k, jiraSnapshot(found.get(k), nowIso)); else await fetchOne(cloudId, k) }
      } catch (e) {
        if (accessLost(e)) throw e
        for (const k of chunk) await fetchOne(cloudId, k)
      }
      done += chunk.length
    }
    await patchDoc('config/settings', { jira: { ...settings().jira, lastRefreshedAt: new Date().toISOString() } })
    toast(done ? `Refreshed ${done} Jira ticket${done === 1 ? '' : 's'}.` : 'No Jira keys on open items.')
  } catch (e) {
    toast(accessLost(e) ? 'Jira access was lost: reconnect Atlassian for this page, then refresh.' : `Jira refresh stopped: ${e.message || e.code || e}`, 'bad')
  } finally { S.jiraBusy = false; render() }
}

function render() {

  const keep = [...document.querySelectorAll('[data-keep]')].map(el => [el.dataset.keep, el.scrollLeft, el.scrollTop])
  byId('app').innerHTML = renderMain()
  for (const [k, l, t] of keep) { const el = document.querySelector(`[data-keep="${k}"]`); if (el) { el.scrollLeft = l; el.scrollTop = t } }
  renderDrawer()
}

function renderMain() {
  if (S.error && !ready()) return `<div class="banner bad">${esc(S.error)}</div>`
  if (!ready()) return `<div class="setup"><h2>Team Board</h2><p class="muted">Loading the board…</p></div>`
  if (!S.settings) return renderSetup()
  const banners = []
  if (S.error) banners.push(`<div class="banner bad">${esc(S.error)}</div>`)
  if (!S.canWrite) banners.push('<div class="banner">Read-only: you can look around, but only the board’s owner can change it.</div>')
  if (!S.projects.length) banners.push('<div class="banner warn">Add a project in Settings before capturing work: every idea and task belongs to one. <button class="btn small" data-act="settings">Open Settings</button></div>')
  const inactive = S.members.filter(m => m.active === false).map(m => [m, S.items.filter(i => isOpenTask(i) && !i.archived && i.assigneeId === m.id)]).filter(([, l]) => l.length)
  for (const [m, l] of inactive) banners.push(`<div class="banner warn">${esc(m.name)} is inactive but still has ${l.length} open task${l.length === 1 ? '' : 's'}. <button class="btn small" data-act="reassign-all:${esc(m.id)}">Reassign all</button></div>`)
  const view = { team: viewTeam, kanban: viewKanban, list: viewList, ideas: viewIdeas }[S.ui.view] || viewTeam
  return banners.join('') + view()
}

function renderSetup() {
  return `<div class="setup">
    <h2>Set up Team Board</h2>
    <p>The board is empty: no settings, roster or projects yet.</p>
    <p class="muted">Create the default settings here, then add your team and projects in Settings. Or run <code>/board-setup</code> in Claude Code to do it from a conversation.</p>
    <div><button class="btn primary" data-act="init" ${S.canWrite ? '' : 'disabled'}>Create settings</button></div>
  </div>`
}

function filtered(extra = {}) { return filterItems(S.items, { ...S.ui.f, ...extra }, fctx()) }

function card(it, opts = {}) {
  const fl = flagsFor(it, fctx())
  const p = project(it.projectId)
  const people = it.type === 'task' ? [it.assigneeId, ...(it.collaboratorIds || [])].filter(Boolean) : [it.ownerId].filter(Boolean)
  const keys = it.jiraKeys || it.jiraRefs || []
  const badges = []
  if (fl.overdue) badges.push('<span class="badge bad">Overdue</span>')
  if (fl.slipped) badges.push(`<span class="badge warn" title="ETA moved from ${esc(it.etaOriginal)}">+${fl.slipDays}d</span>`)
  if (fl.blocked) badges.push('<span class="badge bad">Blocked</span>')
  if (fl.stale) badges.push('<span class="badge warn">Stale</span>')
  if (fl.needsClosing) badges.push('<span class="badge ok" title="Every linked Jira ticket is done">Needs closing</span>')
  if (fl.mismatch) badges.push('<span class="badge info" title="Jira shows someone else as assignee">Jira assignee differs</span>')
  if (it.archived) badges.push('<span class="badge">Archived</span>')
  if (opts.stage) badges.push(`<span class="badge">${esc(STAGE_LABEL[it.status])}</span>`)
  return `<div class="card p-${esc(it.priority)}" draggable="${S.canWrite}" data-drag="${esc(it.id)}" data-before="${esc(it.id)}" data-act="open:${esc(it.id)}" tabindex="0" role="button" aria-label="${esc(it.id)} ${esc(it.title)}">
    <div class="card-top"><span class="mono">${esc(it.id)}</span><span class="pill ${esc(it.priority)}">${esc(PRIORITY_LABEL[it.priority] || it.priority)}</span><span class="proj">${esc(p ? p.name : '')}</span></div>
    <div class="card-title">${esc(it.title)}</div>
    <div class="card-meta">${people.length ? `<span class="avs">${people.map(avatar).join('')}</span>` : ''}${it.etaCurrent ? `<span class="eta ${fl.overdue ? 'late' : ''}">ETA ${esc(shortDate(it.etaCurrent))}</span>` : ''}${badges.join('')}${keys.map(jchip).join('')}</div>
  </div>`
}
function jchip(k) {
  const j = S.jira[k]
  const cls = !j ? '' : j.error ? 'err' : j.statusCategory
  const title = !j ? 'Not fetched yet' : j.error ? `${j.error} (${ago(j.fetchedAt)})` : `${j.status} · fetched ${ago(j.fetchedAt)}`
  return `<span class="jchip ${esc(cls)}" title="${esc(title)}">${esc(k)}${j && !j.error && j.status ? ` · ${esc(j.status)}` : ''}</span>`
}

function viewTeam() {
  const s = settings()
  const tasks = filtered({ type: 'task' })
  const wip = wipOver(S.items, s.wipLimit)
  const t = today()
  const cols = activeMembers().filter(m => (!S.ui.f.team || (m.teams || []).includes(S.ui.f.team)) && (!S.ui.f.member || m.id === S.ui.f.member))
  const extra = S.members.filter(m => m.active === false && tasks.some(i => i.assigneeId === m.id && isOpenTask(i)))
  const col = (m, id) => {
    const mine = tasks.filter(i => (id === 'unassigned' ? !i.assigneeId : i.assigneeId === id))
    const ongoing = mine.filter(isOngoing).sort(byQueue)
    const next = mine.filter(i => (i.status === 'assigned' || i.status === 'backlog')).sort(id === 'unassigned' ? byPriority : byQueue)
    const done = id === 'unassigned' ? [] : mine.filter(i => i.status === 'done' && i.endDate && daysBetween(i.endDate, t) <= s.recentlyDoneDays).sort((a, b) => String(b.endDate).localeCompare(String(a.endDate)))
    const sec = (key, label, list, extraLabel = '') => `<div class="sec" data-drop="team:${esc(id)}:${key}"><div class="sec-label">${label} <span class="mono">${list.length}</span>${extraLabel}</div>${list.map(i => card(i)).join('') || '<div class="empty">Nothing here</div>'}</div>`
    return `<section class="col" aria-label="${esc(m ? m.name : 'Unassigned')}">
      <div class="col-head">${m ? avatar(m.id) : ''}<div style="min-width:0"><div class="name">${esc(m ? m.name : 'Unassigned')}${m && m.active === false ? ' <span class="badge warn">Inactive</span>' : ''}${m && m.isSenior ? ' <span class="badge">Senior</span>' : ''}</div><div class="teams">${esc(m ? (m.teams || []).join(' · ') : 'Pick up from here')}</div></div><span class="count">${mine.filter(isOpenTask).length} open</span></div>
      ${id === 'unassigned' ? sec('next', 'Waiting', next) : sec('ongoing', 'Ongoing', ongoing, wip[id] ? `<span class="wip">over WIP limit (${s.wipLimit})</span>` : '') + sec('next', 'Up next', next) + sec('done', `Done, last ${s.recentlyDoneDays} days`, done)}
    </section>`
  }
  if (!S.members.length) return '<div class="banner warn">No team members yet. Add them in Settings. <button class="btn small" data-act="settings">Open Settings</button></div>'
  return `<div class="board" data-keep="team">${[...cols, ...extra].map(m => col(m, m.id)).join('')}${S.ui.f.member ? '' : col(null, 'unassigned')}</div>`
}

function viewKanban() {
  const ideas = S.ui.f.type === 'idea'
  const list = filtered(ideas ? { type: 'idea' } : { type: 'task' })

  }).join('')}</div>`

const LIST_COLS = [['id', 'ID'], ['title', 'Title'], ['type', 'Type'], ['project', 'Project'], ['priority', 'Priority'], ['status', 'Status'], ['person', 'Assignee / owner'], ['eta', 'ETA'], ['flags', 'Flags'], ['jira', 'Jira']]
function viewList() {
  const { key, dir } = S.ui.sort
  const rows = filtered()
  const val = (i, k) => k === 'project' ? (project(i.projectId) || {}).name || '' : k === 'person' ? nameOf(i.assigneeId || i.ownerId) : k === 'eta' ? i.etaCurrent || '9999' : k === 'status' ? (i.type === 'task' ? TASK_STAGES : IDEA_STAGES).indexOf(i.status) : k === 'priority' ? PRIORITIES.indexOf(i.priority) : String(i[k] ?? '')
  rows.sort(key ? (a, b) => { const x = val(a, key), y = val(b, key); return (x < y ? -1 : x > y ? 1 : byPriority(a, b)) * dir } : byPriority)
  for (const id of [...S.selected]) if (!rows.some(r => r.id === id)) S.selected.delete(id)
  const shown = rows.slice(0, S.listLimit)
  const fx = fctx()
  const sel = S.selected.size
  const bulk = sel ? `<div class="bulk"><b>${sel} selected</b>
    <select id="bulk-assignee" data-bulk="assigneeId" aria-label="Reassign"><option value="">Reassign…</option>${opt('__none', 'Unassign', '')}${activeMembers().map(m => opt(m.id, m.name, '')).join('')}</select>
    <select id="bulk-priority" data-bulk="priority" aria-label="Set priority"><option value="">Priority…</option>${PRIORITIES.map(p => opt(p, PRIORITY_LABEL[p], '')).join('')}</select>
    <select id="bulk-project" data-bulk="projectId" aria-label="Set project"><option value="">Project…</option>${S.projects.map(p => opt(p.id, p.name, '')).join('')}</select>
    <select id="bulk-status" data-bulk="status" aria-label="Set status"><option value="">Status…</option>${[...TASK_STAGES, ...IDEA_STAGES].map(s => opt(s, STAGE_LABEL[s], '')).join('')}</select>
    <button class="btn small" data-act="bulk-archive">Archive</button><button class="btn small ghost" data-act="bulk-clear">Clear selection</button></div>` : ''
  return `${bulk}<div class="tablewrap" data-keep="list"><table class="list"><thead><tr><th><input type="checkbox" id="sel-all" data-act="sel-all" aria-label="Select all" ${sel && sel === rows.length ? 'checked' : ''}></th>${LIST_COLS.map(([k, l]) => `<th>${['flags', 'jira'].includes(k) ? l : `<button data-act="sort:${k}">${l}${key === k ? (dir > 0 ? ' ↑' : ' ↓') : ''}</button>`}</th>`).join('')}</tr></thead>
    <tbody data-drop="list">${shown.map(i => {
      const fl = flagsFor(i, fx)
      return `<tr class="row" draggable="${S.canWrite && !key}" data-drag="${esc(i.id)}" data-before="${esc(i.id)}" data-act="open:${esc(i.id)}">

        <td class="mono">${esc(i.id)}</td><td class="title">${esc(i.title)}${i.archived ? ' <span class="badge">Archived</span>' : ''}</td><td>${i.type === 'idea' ? 'Idea' : 'Task'}</td>
        <td>${esc((project(i.projectId) || {}).name || '')}</td><td><span class="pill ${esc(i.priority)}">${esc(PRIORITY_LABEL[i.priority])}</span></td><td>${esc(STAGE_LABEL[i.status])}</td>
        <td>${esc(i.type === 'task' ? (i.assigneeId ? nameOf(i.assigneeId) : '') : nameOf(i.ownerId))}</td>
        <td class="mono ${fl.overdue ? 'eta late' : ''}">${esc(i.etaCurrent || '')}</td>
        <td>${Object.keys(FLAG_LABEL).filter(k => fl[k]).map(k => `<span class="badge ${k === 'needsClosing' ? 'ok' : k === 'slipped' || k === 'stale' ? 'warn' : 'bad'}">${FLAG_LABEL[k]}</span>`).join(' ')}</td>
        <td>${(i.jiraKeys || i.jiraRefs || []).map(jchip).join(' ')}</td></tr>`
    }).join('') || `<tr><td colspan="11" class="muted">No items match these filters.</td></tr>`}</tbody></table></div>
    ${rows.length > shown.length ? `<p class="muted">Showing ${shown.length} of ${rows.length}. <button class="btn small" data-act="list-more">Show 200 more</button></p>` : ''}
    ${key ? '<p class="muted">Sorted by a column: clear the sort (click it until the arrow goes) to drag rows into order.</p>' : ''}`
}

// ── drawer ─────────────────────────────────────────────────────────────
function renderDrawer() {
  const el = byId('drawer')
  const it = S.drawerId && item(S.drawerId)
  if (!it) { el.hidden = true; el.innerHTML = ''; return }
  if (el.contains(document.activeElement) && !el.hidden && el.dataset.id === it.id && document.activeElement.matches('input, textarea, select')) { S.drawerDirty = true; return }
  const keep = el.querySelector('.dr-body') ? el.querySelector('.dr-body').scrollTop : 0
  el.hidden = false
  el.dataset.id = it.id
  el.innerHTML = drawerHtml(it)
  const body = el.querySelector('.dr-body')
  if (body) body.scrollTop = keep
  S.drawerDirty = false
}

function dateField(it, field, label) {
  const manual = (it.manualDateFlags || []).includes(field)
  return `<label class="f"><span>${label}${manual ? ' <em class="edited">edited</em>' : ''}</span><input type="date" id="d-${field}" data-field="${field}" value="${esc(it[field] || '')}"></label>`
}

function drawerHtml(it) {
  const fl = flagsFor(it, fctx())
  const isTask = it.type === 'task'
  const evs = S.events.filter(e => e.itemId === it.id).sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)))

  const keys = isTask ? it.jiraKeys || [] : it.jiraRefs || []

  const flagBadges = [fl.overdue && '<span class="badge bad">Overdue</span>', fl.slipped && `<span class="badge warn">Slipped ${fl.slipDays}d</span>`, fl.stale && '<span class="badge warn">Stale</span>', fl.blocked && '<span class="badge bad">Blocked</span>', fl.needsClosing && '<span class="badge ok">Needs closing: every Jira ticket is done</span>', fl.mismatch && '<span class="badge info">Jira assignee differs</span>', it.archived && '<span class="badge">Archived</span>'].filter(Boolean)
  const memberOpts = cur => opt('', 'Unassigned', cur || '') + [...activeMembers(), ...S.members.filter(m => m.active === false && m.id === cur)].map(m => opt(m.id, m.name + (m.active === false ? ' (inactive)' : ''), cur || '')).join('')
  const src = it.sourceIdeaId && item(it.sourceIdeaId)
  return `
  <div class="dr-head"><span class="mono">${esc(it.id)}</span><span class="badge">${isTask ? 'Task' : 'Idea'}</span><span class="muted" style="font-size:12px;margin-left:auto">Updated ${esc(ago(it.updatedAt))}</span><button class="btn small ghost" data-act="close-drawer" aria-label="Close">✕</button></div>
  <div class="dr-body">
    <div><input class="dr-title" id="d-title" data-field="title" value="${esc(it.title)}" maxlength="120" aria-label="Title">${flagBadges.length ? `<div class="card-meta" style="margin-top:6px">${flagBadges.join('')}</div>` : ''}</div>
    <div class="fields">
      <label class="f"><span>Project</span><select id="d-project" data-field="projectId">${opt('', 'No project', it.projectId || '')}${S.projects.map(p => opt(p.id, p.name, it.projectId || '')).join('')}</select></label>

function reportInputs(form) {
  const kind = form.scopeKind.value
  return { scope: kind === 'team' ? { kind } : { kind, value: form.scopeValue.value }, period: form.period.value, custom: { from: form.from.value, to: form.to.value } }
}
function scopeValues(kind, cur) {
  if (kind === 'group') return teams().map(t => opt(t, t, cur)).join('')
  if (kind === 'project') return S.projects.map(p => opt(p.id, p.name, cur)).join('')
  if (kind === 'member') return S.members.map(m => opt(m.id, m.name, cur)).join('')
  return opt('', '—', '')
}

function exportButtons(id) {
  const dis = S.downloads ? '' : 'disabled title="Downloads are not available in this view"'
  return `<div class="row-actions"><button class="btn small" data-act="export-md:${esc(id)}" ${dis}>Export Markdown</button><button class="btn small" data-act="export-csv:${esc(id)}" ${dis}>Export CSV</button><button class="btn small" data-act="export-pdf:${esc(id)}" ${dis}>Export PDF</button>${S.downloads ? '' : '<span class="muted" style="font-size:12px">Downloads are not available in this view.</span>'}</div>`

function summaryBlock(doc) {
  return `<label class="f"><span>Executive summary (editable; saved when you leave the box)</span><textarea id="rp-summary" data-report="${esc(doc.id)}" rows="5" placeholder="3 to 5 plain sentences about this period.">${esc(doc.summary || '')}</textarea></label>
  ${S.sample ? `<div><button class="btn small" data-act="draft-summary:${esc(doc.id)}">Draft with Claude</button> <span class="muted" style="font-size:12px">Drafted from the numbers below only.</span></div>` : '<p class="muted" style="margin:0;font-size:12px">Drafting with Claude is not available in this view; write the summary yourself.</p>'}`
}
function savedReportHtml(doc) {
  return `<div class="row-actions" style="align-items:baseline"><h3 style="margin:0;margin-right:auto">${esc(doc.scopeLabel)} · ${esc((doc.range || {}).label || '')}</h3><span class="muted mono" style="font-size:12px">generated ${esc(String(doc.generatedAt).slice(0, 16).replace('T', ' '))}</span></div>
  ${exportButtons(doc.id)}${summaryBlock(doc)}<div class="md" id="rp-md">${mdToHtml(stripSummary(doc.markdown || ''))}</div>`
}
function stripSummary(md) { return md.replace(/## Executive summary\n\n[\s\S]*?\n\n(?=## )/, '') }
function mdInline(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>') }
function mdToHtml(md) {
  const out = []
  const lines = md.split('\n')
  for (let i = 0; i < lines.length; i++) {
    const l = lines[i]
    if (l.startsWith('# ')) out.push(`<h1>${mdInline(l.slice(2))}</h1>`)
    else if (l.startsWith('## ')) out.push(`<h2>${mdInline(l.slice(3))}</h2>`)
    else if (l.startsWith('- ')) { const items = []; while (i < lines.length && lines[i].startsWith('- ')) items.push(`<li>${mdInline(lines[i++].slice(2))}</li>`); i--; out.push(`<ul>${items.join('')}</ul>`) }
    else if (l.startsWith('|')) { const rows = []; while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++]); i--; out.push(`<div class="tw"><table>${rows.filter(r => !/^\|\s*-/.test(r)).map((r, n) => `<tr>${r.split(/(?<!\\)\|/).slice(1, -1).map(c => n === 0 ? `<th>${mdInline(c.trim().replace(/\\\|/g, '|'))}</th>` : `<td>${mdInline(c.trim().replace(/\\\|/g, '|'))}</td>`).join('')}</tr>`).join('')}</table></div>`) }
    else if (l.trim()) out.push(`<p>${mdInline(l)}</p>`)
  }
  return out.join('')
}
async function generateReport(form) {
  const inp = reportInputs(form)
  if (inp.scope.kind !== 'team' && !inp.scope.value) { toast('Pick which one first.', 'warn'); return }
  if (inp.period === 'custom' && !(isDate(inp.custom.from) && isDate(inp.custom.to))) { toast('Pick both dates of the custom range.', 'warn'); return }
  S.reportView = inp

function pdfOf(md) {
  const J = window.jspdf && window.jspdf.jsPDF
  if (!J) throw new Error('the PDF library did not load')
  const pdf = new J({ unit: 'pt', format: 'a4' })
  const W = pdf.internal.pageSize.getWidth() - 96
  const H = pdf.internal.pageSize.getHeight() - 56
  let y = 56
  const write = (text, size, bold, gap = 4) => {
    pdf.setFont('helvetica', bold ? 'bold' : 'normal')
    pdf.setFontSize(size)
    for (const line of pdf.splitTextToSize(text, W)) { if (y > H) { pdf.addPage(); y = 56 } pdf.text(line, 48, y); y += size * 1.3 }
    y += gap
  }
  for (const raw of md.split('\n')) {
    const l = raw.replace(/\*\*(.+?)\*\*/g, '$1')
    if (raw.startsWith('# ')) write(l.slice(2), 17, true, 6)
    else if (raw.startsWith('## ')) { y += 6; write(l.slice(3), 12.5, true, 2) }
    else if (raw.startsWith('- ')) write(`•  ${l.slice(2)}`, 10, false, 1)
    else if (/^\|\s*-/.test(raw)) continue
    else if (raw.startsWith('|')) write(raw.split(/(?<!\\)\|/).slice(1, -1).map(c => c.trim().replace(/\\\|/g, '|')).join('   ·   '), 10, false, 1)
    else if (raw.startsWith('**')) write(l, 10.5, true, 1)
    else if (raw.trim()) write(l, 10, false, 3)
  }
  return pdf.output('arraybuffer')
}

      await put(`events/${s.id}`, s)

    }

    case 'draft-summary': return draftSummary(arg)

    case 'export-csv': return exportReport(arg, 'csv')

    }

      await S.db.doc(`projects/${arg}`).delete(); return openSettings()
    }
  }
}

async function commitField(it, field, el) {
  const v = el.value
  if (field === 'title' && !v.trim()) { el.value = it.title; toast('A title is needed.', 'warn'); return }
  if (['startDate', 'reviewRequestedAt', 'endDate', 'reviewedOn'].includes(field)) return writeChange(it, { dates: { [field]: v || null } })
  if (field === 'eta') return writeChange(it, { eta: v || null })
  if (field === 'assigneeId') {
    const ch = { assigneeId: v || null }
    if (v && it.status === 'backlog') { const r = await confirmBox(`Assign ${it.id} to ${nameOf(v)}?`, { ok: 'Assign', option: 'Also move it to Assigned' }); if (!r.ok) { el.value = it.assigneeId || ''; return } if (r.option) ch.status = 'assigned' }
    return writeChange(it, ch)
  }
  if (['projectId', 'ownerId', 'reviewedBy'].includes(field)) return writeChange(it, { [field]: v || null })
  return writeChange(it, { [field]: v })
}

// ── drag and drop ──────────────────────────────────────────────────────
async function onDrop(zone, beforeId) {
  const it = item(S.dragId)
  S.dragId = null
  if (!it || !S.canWrite) return
  const before = beforeId && beforeId !== it.id ? item(beforeId) : null
  const [kind, a, b] = zone.split(':')
  if (kind === 'team') {
    const to = a === 'unassigned' ? null : a
    if ((it.assigneeId || null) !== to) {
      const r = await confirmBox(to ? `Reassign ${it.id} to ${nameOf(to)}?` : `Unassign ${it.id}?`, { ok: to ? 'Reassign' : 'Unassign', option: to && it.status === 'backlog' ? 'Also move it to Assigned' : '' })
      if (!r.ok) return
      const ch = { assigneeId: to }
      if (r.option) ch.status = 'assigned'
      return writeChange(it, ch)
    }
    if (b === 'next' && to) {
      const q = S.items.filter(i => i.type === 'task' && i.assigneeId === to && ['assigned', 'backlog'].includes(i.status) && i.id !== it.id && !i.archived).sort(byQueue)
      const idx = before ? q.findIndex(x => x.id === before.id) : q.length
      const prev = idx > 0 ? q[idx - 1] : null
      return writeChange(it, { queueRank: rankBetween(prev ? prev.queueRank : '', before ? before.queueRank : null) })
    }
    if (b === 'ongoing' && !isOngoing(it)) return writeChange(it, { status: 'in_progress' })
    if (b === 'done' && it.status !== 'done') return writeChange(it, { status: 'done' })
    return
  }
  if (kind === 'stage') {
    if (it.status !== a) return writeChange(it, { status: a })
    return reorder(it, before)
  }
  if (kind === 'ideas') {
    if (it.priority !== a) return writeChange(it, { priority: a })
    return reorder(it, before)
  }
  if (kind === 'list') return S.ui.sort.key ? null : reorder(it, before)
}
function reorder(it, before) {
  if (!before) return
  if (before.priority !== it.priority) { toast('Order is kept within a priority level; change the priority to move it across.', 'warn'); return }
  const band = S.items.filter(i => i.type === it.type && i.priority === it.priority && i.id !== it.id).sort(byPriority)
  const idx = band.findIndex(x => x.id === before.id)
  const prev = idx > 0 ? band[idx - 1] : null
  return writeChange(it, { rank: rankBetween(prev ? prev.rank : '', before.rank) })
}

})
document.addEventListener('drop', e => {
  const z = e.target.closest && e.target.closest('[data-drop]')
  if (!z || !S.dragId) return
  e.preventDefault()
  z.classList.remove('drop-on')
  const b = e.target.closest('[data-before]')
  onDrop(z.dataset.drop, b && z.contains(b) ? b.dataset.before : null).catch(err => toast(String(err.message || err), 'bad'))
})

setInterval(() => { if (ready() && !document.activeElement.matches('input, textarea, select')) renderTop() }, 60000)
boot()
</script>
